<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>VaultBreach</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#07080d;--ink:#e6ecf2;--dim:#8a95a6;--cy:#3ee6ff;--rd:#ff3b4e;--am:#ffb347;--pn:rgba(10,14,24,.5);--ln:rgba(120,200,255,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{text-shadow:0 1px 3px rgba(0,0,0,.9);margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Courier New",ui-monospace,monospace;min-height:100vh}
#bg{position:fixed;inset:0;z-index:0;transition:background 1s}#bg::after{content:"";position:absolute;inset:0}
.b-bed{background:linear-gradient(#0a0720,#1c1358 80%,#2a2a7a)}.b-bed::after{background:repeating-linear-gradient(100deg,transparent 0 9px,rgba(150,170,255,.22) 9px 10px);animation:rain .5s linear infinite}
.b-cafe{background:radial-gradient(circle at 20% 30%,rgba(255,170,60,.45) 0 40px,transparent 41px),radial-gradient(circle at 70% 20%,rgba(255,200,90,.35) 0 60px,transparent 61px),radial-gradient(circle at 85% 70%,rgba(255,140,40,.4) 0 50px,transparent 51px),linear-gradient(#2b1708,#4a2a10)}.b-cafe::after{background:radial-gradient(circle at 50% 110%,transparent 30%,rgba(255,200,100,.18) 31% 33%,transparent 34% 40%,rgba(255,200,100,.12) 41% 43%,transparent 44%);animation:pulse 3s ease-in-out infinite}
.b-sub{background:linear-gradient(#050712,#0b1530)}.b-sub::after{background:repeating-linear-gradient(90deg,transparent 0 60px,rgba(255,60,200,.35) 60px 64px,transparent 64px 140px,rgba(60,255,200,.3) 140px 143px);animation:slide .8s linear infinite;opacity:.6}
.b-off{background:linear-gradient(#03202e,#0a4a5e 70%,#082a3a)}.b-off::after{background:linear-gradient(90deg,#062a3a 0 8%,#0a3a50 8% 15%,#062a3a 15% 30%,#0a3a50 30% 36%,#062a3a 36% 55%,#0a3a50 55% 62%,#062a3a 62%) bottom/100% 45% no-repeat,repeating-linear-gradient(0deg,transparent 0 24px,rgba(100,240,255,.08) 24px 25px);animation:pulse 5s infinite}
.b-vault{background:#16030a}.b-vault::after{background:repeating-linear-gradient(0deg,transparent 0 28px,rgba(255,40,70,.25) 28px 29px),repeating-linear-gradient(90deg,transparent 0 28px,rgba(255,40,70,.25) 28px 29px),radial-gradient(circle,transparent 30%,rgba(255,0,40,.5));animation:strobe 1s steps(2) infinite}
#bg.img{background-size:cover!important;background-position:center!important}#bg.img::after{opacity:.2}#bg.img{box-shadow:inset 0 0 200px rgba(0,0,0,.3)}
.zone{border:1px solid #2a3547;padding:9px 11px;margin:8px 0;border-radius:4px;background:#0a1220}.zone.todo{cursor:pointer}.zone.todo:hover{border-color:var(--cy);box-shadow:0 0 10px var(--cy)}.zone.on{border-color:var(--am)}.zone .lb{color:var(--dim);font-size:12px}.zn{letter-spacing:4px;color:#33415a}
@keyframes rev{from{filter:blur(7px);opacity:0;transform:translateX(-8px)}}.rev{animation:rev .5s}
@keyframes flk{0%,90%,100%{opacity:1}92%{opacity:.35}94%{opacity:.95}96%{opacity:.25}}.flk{animation:flk 4s infinite}
@keyframes rain{to{background-position:-20px 40px}}@keyframes slide{to{background-position:-140px 0}}@keyframes pulse{50%{opacity:.4}}@keyframes strobe{50%{opacity:.35}}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,5px)}}.shake{animation:shake .45s}
@keyframes hit{50%{filter:brightness(3) hue-rotate(60deg);transform:scale(.94)}}.hit{animation:hit .25s}
@keyframes burn{to{opacity:0;letter-spacing:6px;filter:blur(4px)}}.burn{animation:burn 1.2s forwards}
#flash{position:fixed;inset:0;z-index:50;pointer-events:none;opacity:0;transition:opacity .4s}
#app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:12px}
nav{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:10px}
h1{margin:0;font-size:22px;letter-spacing:3px;color:var(--cy);text-shadow:0 0 14px var(--cy)}
.pn{background:var(--pn);border:1px solid var(--ln);border-radius:4px;padding:14px;margin-bottom:12px;backdrop-filter:blur(1px)}
button{font:inherit;color:var(--ink);background:#0d1a2a;border:1px solid var(--cy);border-radius:3px;padding:9px 13px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){background:var(--cy);color:#001018}button:disabled{opacity:.35;cursor:not-allowed}
button.rd{border-color:var(--rd)}button.rd:hover:not(:disabled){background:var(--rd);color:#fff}button.am{border-color:var(--am)}button.am:hover:not(:disabled){background:var(--am);color:#1a0d00}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--am);outline-offset:2px}
textarea{width:100%;min-height:90px;background:#050a12;color:var(--ink);border:1px solid var(--ln);border-radius:3px;padding:10px;font:inherit}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
.chip{border:1px solid var(--ln);padding:5px 9px;border-radius:3px;cursor:pointer;background:#0a1220}.chip.on{border-color:var(--cy);color:var(--cy);box-shadow:0 0 8px var(--cy)}
.dim{color:var(--dim)}.warn{color:var(--rd);border:1px dashed var(--rd);padding:9px;margin:10px 0}
.sh{font-size:24px;filter:drop-shadow(0 0 6px var(--cy));transition:.3s}.sh.x{filter:grayscale(1) opacity(.2);transform:scale(.7) rotate(25deg)}
.bar{height:10px;background:#111a28;border:1px solid var(--ln);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;transition:width .15s}
.dev{background:rgba(8,12,20,.55);border:1px solid #2a3547;border-radius:8px;padding:12px}
.meta{border:1px dashed var(--am);color:var(--am);padding:9px;margin-top:10px;font-size:13px}.meta div{margin:2px 0}
.enemy{font-size:84px;text-align:center;filter:drop-shadow(0 0 18px var(--rd));user-select:none}
.post{padding:10px;border:1px solid var(--ln);margin-bottom:8px;cursor:pointer;background:#0a1220}.post.dead{cursor:default;color:var(--dim);text-decoration:line-through}
.big{font-size:40px;letter-spacing:6px;text-align:center;color:var(--rd);text-shadow:0 0 20px var(--rd);margin:20px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="bg" class="b-vault"></div><div id="flash"></div>

function kill(id){try{localStorage.setItem('vb_'+id,'1')}catch(e){}}

function avatar(a,sz=140){const c=COL[a.c],h=a.h,d=a.d;if(PORT())return `<img src="${GAME_ASSETS.avatars[a.h]}" alt="Net-Guardian ${CHARN[a.h]}" style="width:${sz}px;height:${sz}px;object-fit:cover;object-position:center top;border-radius:10px;border:2px solid ${c};box-shadow:0 0 26px ${c}">`;return `<svg width="${sz}" height="${sz}" viewBox="0 0 140 140"><rect x="40" y="82" width="60" height="50" rx="10" fill="${c}" opacity=".85"/><circle cx="70" cy="56" r="26" fill="#d9b99b"/>${h==0?`<path d="M62 24l8-14 8 14z" fill="#222"/><rect x="48" y="28" width="44" height="12" fill="#222"/>`:h==1?`<path d="M44 56q0-34 26-34t26 34v-14q-8-12-26-12t-26 12z" fill="#222"/>`:h==2?`<ellipse cx="70" cy="22" rx="22" ry="5" fill="none" stroke="${c}" stroke-width="3"/>`:`<circle cx="46" cy="32" r="10" fill="#222"/><circle cx="94" cy="32" r="10" fill="#222"/>`}<rect x="48" y="48" width="44" height="12" rx="6" fill="${c}" opacity=".9"/>${a.c==0&&ok(GAME_ASSETS.avatarParts.visorCyan)?`<image href="${GAME_ASSETS.avatarParts.visorCyan}" x="44" y="42" width="52" height="24"/>`:''}${a.a==0?`<rect x="64" y="80" width="12" height="6" fill="#aaa"/>`:a.a==1?`<line x="" x1="96" y1="50" x2="108" y2="26" stroke="${c}" stroke-width="3"/>`:a.a==2?`<path d="M48 80q22 14 44 0" stroke="${c}" stroke-width="7" fill="none"/>`:''}<g transform="translate(108 40)">${d==0?(ok(GAME_ASSETS.avatarParts.droneScout)?`<image href="${GAME_ASSETS.avatarParts.droneScout}" x="-16" y="-16" width="32" height="32"/>`:`<circle r="9" fill="${c}"/>`):d==1?`<path d="M-10 0l10-8 10 8-10 8z" fill="${c}"/>`:d==2?`<rect x="-8" y="-8" width="16" height="16" fill="${c}"/>`:`<ellipse rx="11" ry="7" fill="#fff"/><circle r="4" fill="${c}"/>`}</g></svg>`}
function shields(){return [..."🛡🛡🛡"].map((s,i)=>`<span class="sh ${i<G.sh?'':'x'}" title="${['2FA Token','Cold Backup','Hardware Key'][i]}">${s}</span>`).join('')}
function nav(){return `<nav><h1>VAULTBREACH</h1><div class="row"><span>${shields()}</span><button onclick="tab='play';render()">Game</button><button class="am" onclick="tab='feed';render()">Leak Feed</button></div></nav>`}
function render(){clearInterval(tick);const bg=tab=='feed'?'b-vault':(G.screen=='play'&&S[G.i]?S[G.i].bg:'b-vault');setBg(bg);let h=nav();
if(tab=='feed')h+=feedV();else if(G.screen=='onboard')h+=onb();else if(G.screen=='play')h+=G.ph=='combat'?combat():triage();else h+=over();
$('#app').innerHTML=h;if(tab=='play'&&G.screen=='play'&&G.ph=='combat')startCombat()}
function onb(){const o=(arr,k,key)=>arr.map((x,i)=>`<span class="chip ${G.av[key]==i?'on':''}" onclick="G.av.${key}=${i};snd(500);render()">${k=='c'?`<b style="color:${x}">■</b>`:x}</span>`).join('');
return `<div class="grid2"><div class="pn" style="text-align:center"><div>${avatar(G.av,200)}</div><div class="dim">Net-Guardian preview</div></div><div class="pn"><b>Customize</b><p>${PORT()?'Net-Guardian':'Visor/Hair'}<br><span class="row">${o(PORT()?CHARN:HAIR,'h','h')}</span></p><p>${PORT()?'Aura color':'Outfit color'}<br><span class="row">${o(COL,'c','c')}</span></p>${PORT()?'':`<p>Accessory<br><span class="row">${o(ACC,'a','a')}</span></p><p>Drone<br><span class="row">${o(DRN,'d','d')}</span></p>`}</div></div>
<div class="pn"><b>The Vault Lock</b><p class="dim">Type an embarrassing memory. It stays sealed unless you lose.</p><textarea id="sec" maxlength="240" placeholder="Your embarrassing memory..." oninput="G.secret=this.value;$('#go').disabled=!this.value.trim()">${esc(G.secret)}</textarea>
<div class="row" style="margin-top:8px"><button onclick="G.secret=CONF[Math.random()*CONF.length|0];render()">Generate random confession</button></div>
<div class="warn">WARNING: lose all 3 Fail-Safes and this memory is stripped of your name and pushed to the Anonymous Leak Feed. Any player can read it ONCE before it self-destructs. (Simulated: nothing leaves this page. Don't type a real secret.)</div>
<button id="go" class="am" ${G.secret.trim()?'':'disabled'} onclick="start()">Seal the Vault and begin</button></div>`}
function start(){G.secret=G.secret.trim();G.screen='play';G.ph='triage';G.i=0;snd(300,.3,'sawtooth');render()}
function scan(i){if(G.sc[i])return;G.sc[i]=1;G.last=i;snd(180,.15,'sine',.08);setTimeout(()=>snd(90,.25,'sawtooth',.04),120);render()}
function triage(){const s=S[G.i];if(G.scw!==G.i){G.sc={};G.scw=G.i;G.last=-1}
const Z=[['Sender ID',s.from],['Subject',s.subj],['Message body',s.body],...s.meta.map((m,i)=>['Deep scan '+(i+1),m])],n=Z.filter((z,i)=>G.sc[i]).length,all=n==Z.length,ic={mail:'✉️ Incoming Email',sms:'💬 Incoming SMS',web:'🌐 Browser Portal',popup:'⚠️ System Pop-up'}[s.app];
return `<div class="pn row" style="justify-content:space-between"><span>Entity ${G.i+1}/${S.length}${s.boss?' - BOSS':''}</span><span>Energy ${G.en|0}</span><span>Combo x${G.combo}</span><span>Score ${G.score}</span></div>
<div class="grid2"><div class="dev ${n?'flk':''}"><div class="dim">${ic} - waiting at the Vault door</div>${Z.map((z,i)=>G.sc[i]?`<div class="zone on ${G.last==i?'rev':''}"><div class="lb">${z[0]}</div>${esc(z[1])}</div>`:`<div class="zone todo" tabindex="0" onclick="scan(${i})" onkeydown="if(event.key=='Enter')scan(${i})"><div class="lb">${z[0]}</div><span class="zn">▒▒▒▒▒▒▒▒▒▒▒▒</span> <b style="color:var(--cy)">[ SCAN ]</b></div>`).join('')}</div>
<div class="pn"><b>Inspection ${n}/${Z.length}</b><div class="bar" style="margin:6px 0"><i style="background:var(--am);width:${n/Z.length*100}%"></i></div><p class="dim">${esc(G.msg||'Scan every section. Something here may not be what it claims to be.')}</p>
<div class="meta" style="margin:0 0 10px"><div>Does the sender match the real organization?</div><div>Is there urgency, secrecy or fear?</div><div>Does it ask for a code, login, payment or download?</div><div>Is the link or attachment normal for this?</div><div>Legit messages ask nothing risky of you.</div></div>
<div class="row"><button class="am" ${all?'':'disabled'} onclick="act('cta')">Let it in</button><button class="rd" ${all?'':'disabled'} onclick="act('flag')">Quarantine it</button></div>${all?'':'<p class="dim">Decision locks until every section is scanned.</p>'}</div></div>`}
function triageOld(){const s=S[G.i],ic={mail:'✉️ Email',sms:'💬 Messages',web:'🌐 Browser',popup:'⚠️ System'}[s.app];
return `<div class="pn row" style="justify-content:space-between"><span>Wave ${G.i+1}/${S.length}${s.boss?' - BOSS':''}</span><span>Energy ${G.en}</span><span>Combo x${G.combo}</span><span>Score ${G.score}</span></div>
<div class="grid2"><div class="dev"><div class="dim">${ic}</div><hr style="border-color:#2a3547"><div><b>From:</b> ${esc(s.from)}</div><div><b>${esc(s.subj)}</b></div><p>${esc(s.body)}</p>${G.insp?`<div class="meta">${s.meta.map(m=>`<div>🔎 ${esc(m)}</div>`).join('')}</div>`:''}</div>
<div class="pn"><b>Inspection &amp; Triage</b><p class="dim">${esc(G.msg||'Inspect before you act.')}</p><div class="row"><button class="am" onclick="G.insp=!G.insp;snd(700,.06);render()">${G.insp?'Hide':'Inspect'} Metadata (X-Ray)</button>
<button class="rd" onclick="act('cta')">${esc(s.cta)}</button><button onclick="act('flag')">Flag &amp; Engage Threat</button></div></div></div>`}
function lose(){G.sh--;G.combo=0;shake();flash('rgba(255,0,40,.6)');snd(110,.4,'sawtooth',.1)}
function act(a){const s=S[G.i];if(a=='cta'){if(s.threat){lose();G.msg='';if(G.sh<=0)return end(0);G.en_=s.en;return fight(true)}G.combo++;G.en=Math.min(100,G.en+25);G.score+=50+G.combo*10;snd(880,.15);flash('rgba(60,255,160,.3)');G.msg='Approved. +25 Firewall Energy. '+s.tip;return nextW()}
if(s.threat){snd(600,.1);return fight(false)}G.combo=0;G.en=Math.max(0,G.en-15);G.msg='False positive: this was legitimate. -15 energy. '+s.tip;G.insp=0;snd(150,.2);nextW()}
function fight(breached){const s=S[G.i];G.ph='combat';G.insp=0;G.cd={};G.stun=0;G.e={...s.en,mhp:s.en.hp,t0:s.boss?25:15,time:s.boss?25:15};G.log=breached?'It breached through! Destroy it before the timer ends.':'Threat flagged. Engage!';render()}
function combat(){const e=G.e;return `<div class="pn"><div class="row" style="justify-content:space-between"><b>${esc(e.n)}</b><span>Energy <b id="en">${G.en|0}</b></span></div><div class="enemy" id="enm">${enemyArt(e)}</div>
<div>HP <div class="bar"><i id="hp" style="background:var(--rd);width:100%"></i></div></div><div style="margin-top:6px">Armor <b id="ar">${e.ar}</b></div><div>Breach timer <div class="bar"><i id="tm" style="background:var(--am);width:100%"></i></div></div><p class="dim" id="log">${esc(G.log)}</p></div>
<div class="pn row">${TOOLS.map(t=>`<button id="t_${t.k}" onclick="use('${t.k}')">${t.e} ${t.n}<br><small>${t.c} en / ${t.cd}s</small></button>`).join('')}</div>`}
function startCombat(){upd();let last=Date.now();tick=setInterval(()=>{const n=Date.now(),dt=(n-last)/1000;last=n;G.en=Math.min(100,G.en+2*dt);for(const k in G.cd)G.cd[k]=Math.max(0,G.cd[k]-dt);if(G.stun>0)G.stun-=dt;else G.e.time-=dt;if(G.e.time<=0){clearInterval(tick);lose();G.msg='Breach! '+S[G.i].tip;if(G.sh<=0)return end(0);return nextW()}upd()},100)}
function upd(){if(!$('#hp'))return;const e=G.e;$('#hp').style.width=Math.max(0,e.hp/e.mhp*100)+'%';$('#tm').style.width=Math.max(0,e.time/e.t0*100)+'%';$('#tm').style.background=G.stun>0?'var(--cy)':'var(--am)';$('#ar').textContent=e.ar;$('#en').textContent=G.en|0;$('#log').textContent=G.log;TOOLS.forEach(t=>{const b=$('#t_'+t.k);if(b)b.disabled=G.en<t.c||(G.cd[t.k]||0)>0})}
function use(k){const e=G.e,t=TOOLS.find(x=>x.k==k);if(G.en<t.c||(G.cd[k]||0)>0)return;G.en-=t.c;G.cd[k]=t.cd;let d=0,m='';
if(k=='blade'){d=e.t=='spam'?30:10;m=e.t=='spam'?'Blade shreds the swarm!':'Blade clangs off armor.'}
if(k=='gren'){e.ar=0;d=e.t=='phish'?28:12;m='Sandbox detonated: armor stripped.'}
if(k=='shield'){G.stun=e.t=='mimic'||e.t=='vamp'?5:2;d=e.t=='mimic'||e.t=='vamp'?15:3;m='2FA Shield Bash: enemy stunned '+G.stun+'s.'}
if(k=='cann'){d=e.t=='ransom'?85:35;e.ar=Math.max(0,e.ar-10);m='Encryption Cannon fires!';e.hit=1}
if(k=='vac'){if(e.hp<=e.mhp*.35){e.hp=0;G.en=Math.min(100,G.en+30);m='Captured! +30 energy.'}else{m='Too strong to capture. Weaken below 35% HP.';G.en+=t.c}}
if(k!='vac'||e.hp<=0){const a=Math.min(e.ar,d);if(k!='cann'&&k!='gren'){e.ar-=a;d-=a}e.hp-=d}
G.log=m;snd(300+Math.random()*400,.1,'sawtooth',.06);const em=$('#enm');if(em){em.classList.remove('hit');void em.offsetWidth;em.classList.add('hit')}
if(e.hp<=0){clearInterval(tick);G.combo++;G.score+=100+G.combo*15+(S[G.i].boss?500:0);G.en=Math.min(100,G.en+10);flash('rgba(62,230,255,.4)');snd(1000,.3);G.msg='Threat destroyed. '+S[G.i].tip;nextW()}else upd()}
function nextW(){G.i++;G.insp=0;G.ph='triage';if(G.i>=S.length)return end(1);render()}
function end(w){clearInterval(tick);G.screen='over';G.win=w;if(!w)posts.unshift({id:'own',t:G.secret,own:1});snd(w?900:90,.6,w?'sine':'sawtooth',.1);if(!w){shake();flash('rgba(255,0,40,.7)')}render()}
function over(){if(G.win){const r=G.sh==3&&G.combo>=6?'S':G.sh>=2?'A':'B';return `<div class="pn" style="text-align:center"><div class="big" style="color:var(--cy);text-shadow:0 0 20px var(--cy)">VAULT SEALED</div><p>Security rank <b style="font-size:40px;color:var(--am)">${r}</b></p><p>Score ${G.score} | Fail-Safes left ${G.sh}/3</p><div>${avatar(G.av,160)}</div><p class="dim">Your memory stays locked.</p><button onclick="init()">Play again</button></div>`}
return `<div class="pn" style="text-align:center"><div class="big">VAULT BREACHED</div><p>Stripping username... pushing to Anonymous Leak Feed...</p><div class="warn" style="text-align:left">${esc(G.secret)}</div><p class="dim">Simulated and local only. One read, then it is purged.</p><div class="row" style="justify-content:center"><button class="am" onclick="tab='feed';render()">View Leak Feed</button><button onclick="init()">Try again</button></div></div>`}
function feedV(){return `<div class="pn"><b>Anonymous Leak Feed</b><p class="dim">Each memory can be opened once. After that it is purged.</p>${posts.map((p,i)=>{const d=dead(p.id);return `<div class="post ${d?'dead':''}" id="p${i}" ${d?'':`onclick="readP(${i})"`}>${d?'[DESTROYED - DATA PURGED]':`[ENCRYPTED MEMORY - 1 VIEW REMAINING]${p.own?' (yours)':''}`}</div>`}).join('')}</div>`}
function readP(i){const p=posts[i],el=$('#p'+i);if(dead(p.id)||el.dataset.o)return;el.dataset.o=1;kill(p.id);let n=6;snd(400,.1);el.style.cursor='default';const f=()=>{el.innerHTML=`"${esc(p.t)}"<br><small style="color:var(--rd)">Self-destruct in ${n}s</small>`};f();const iv=setInterval(()=>{n--;if(n>0)return f();clearInterval(iv);el.classList.add('burn');snd(120,.5,'sawtooth');setTimeout(()=>{el.className='post dead';el.textContent='[DESTROYED - DATA PURGED]'},1200)},1000)}
init();
</script></body></html>
